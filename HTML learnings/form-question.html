<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
     <div class="container">
    <h1 id="title">Student Feedback Survey</h1>

    <p id="description">
      Please fill out this form to help us improve the learning experience.
    </p>
    <form id="survey-form">
      <!-- Name -->
      <div>
        <label id="name-label" for="name">Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your full name"
          required
        />
      </div>
      <div>
        <label id="email-label" for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
        />
      </div>
      <div>
        <label id="number-label" for="number">Age</label>
        <input
          type="number"
          id="number"
          name="number"
          placeholder="Age"
          min="10"
          max="100"
        />
      </div>
      <div>
        <label for="dropdown">Select your current role</label>
        <select id="dropdown" name="role">
          <option value="student">Student</option>
          <option value="developer">Developer</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div>
        <p>Would you recommend this course?</p>

        <div class="radio-group">
          <label>
            <input type="radio" name="recommend" value="yes" /> Yes
          </label>

          <label>
            <input type="radio" name="recommend" value="no" /> No
          </label>
        </div>
      </div>
       <div>
        <p>What would you like to improve?</p>

        <div class="checkbox-group">
          <label>
            <input type="checkbox" value="frontend" /> Frontend
          </label>

          <label>
            <input type="checkbox" value="backend" /> Backend
          </label>

          <label>
            <input type="checkbox" value="projects" /> Projects
          </label>
        </div>
      </div>
      <div>
        <label for="comments">Additional Comments</label>

        <textarea
          id="comments"
          name="comments"
          rows="5"
          placeholder="Write your comments here..."
        ></textarea>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submit">Submit</button>
    </form>
  </div>
  </body>
</html>
